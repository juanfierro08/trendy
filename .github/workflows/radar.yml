name: Trendy Radar Sentinel

on:
  schedule:
    # Se ejecuta automáticamente cada 10 minutos
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Selecciona la acción a ejecutar"
        required: true
        default: "check"
        type: choice
        options:
          - "check"
          - "test_email"
          - "simulate"
          - "reset"

concurrency:
  group: trendy-radar-sentinel
  cancel-in-progress: false

jobs:
  check-trendyshop:
    name: Revisar Calendario de Adviento
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar revisión de VTEX o Prueba seleccionada
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENT_EMAIL: ${{ secrets.ALERT_RECIPIENT_EMAIL }}
          CHOSEN_ACTION: ${{ github.event.inputs.action || 'check' }}
        run: |
          python monitor.py --action "$CHOSEN_ACTION"

      - name: Guardar estado si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/estado.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "chore(radar): actualizar data/estado.json [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i*3))
          done
          echo "No se pudo guardar el estado"
          exit 1

